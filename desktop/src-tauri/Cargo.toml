[package]
name = "lottery-assistant"
version = "0.1.3"
description = "活动签到抽奖助手桌面端"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[features]
custom-protocol = ["tauri/custom-protocol"]
